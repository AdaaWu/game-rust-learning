<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rust Quest POC</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Huninn&family=Fredoka:wght@500;600;700&family=JetBrains+Mono:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // 首次繪製前套用風格與深淺色，避免閃爍
      ;(function () {
        var q = new URLSearchParams(location.search)
        var style = q.get('style'), mode = q.get('mode')
        try {
          style = style || localStorage.getItem('rq.poc.style')
          mode = mode || localStorage.getItem('rq.poc.mode')
        } catch (e) {}
        style = /^[ABC]$/.test(style || '') ? style : 'B'
        mode = mode === 'light' || mode === 'dark' ? mode : 'system'
        var dark = mode === 'dark' || (mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.style = style
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
