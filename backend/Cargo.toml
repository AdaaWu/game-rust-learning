[package]
name = "rust_quest_backend"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.0", features = ["full"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[dev-dependencies]
cucumber = "0.23.0"
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }

[[test]]
name = "cucumber"
harness = false
