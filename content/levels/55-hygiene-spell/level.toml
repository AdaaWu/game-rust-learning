story = """
我照著巫師的筆記刻了兩道短咒語：`walk!` 往前走一格、`grab!` 撿起寶石，都記進我的行囊 `cmds`。
可是一唸出來，編譯器每一行都說找不到 `cmds`，明明行囊就在我手上！
海鷗冷冷地說：「咒語在工坊裡刻好，又不知道你的行囊叫什麼名字。」
"""

concept = """
## 本關要做到

- 兩道咒語改成可以指定行囊：`walk!(bag, DIR)`、`grab!(bag)`
- Submit 時測試會用別的行囊名字呼叫，例如 `walk!(pack, LEFT)`；簽名不對時，錯誤會出現在測試裡（例如 `no rules expected ,`）

## 讀懂這個錯誤

- **E0425**：cannot find value `cmds` in this scope
- 每個呼叫點都報一次，因為每次呼叫都展開出一份 `cmds.push(...)`
- 錯誤指在巨集定義裡，但 note 會寫 `in this macro invocation`，告訴你是哪一次呼叫展開出來的

## 巨集衛生（hygiene）

- `macro_rules!` 展開時，巨集本體裡寫的區域變數名稱帶著「出生地」：它屬於巨集定義的位置，不屬於呼叫端
- 所以巨集裡的 `cmds` 和呼叫端 `let mut cmds` 是**兩個不同的名字**，即使拼法一樣
- 反過來也成立：巨集內 `let tmp = ...;` 不會蓋掉呼叫端同名的 `tmp`，這正是衛生要保護的事
- 只有區域變數、標籤（label）受這種保護；函式、型別、其他巨集照一般路徑規則找

## 修法：把名稱當參數傳進去

- 巨集改成 `walk!(bag, DIR)`：matcher 加一個 `$bag:ident`，本體寫 `$bag.push(...)`
- 呼叫端傳入自己的變數名：`walk!(cmds, RIGHT)`、`grab!(cmds)`
- 名字是呼叫端寫的，`$bag` 就帶著呼叫端的出生地，指到呼叫端的變數
- 這不是單行修正：巨集簽名改了，**每個呼叫點**都要跟著改

## 取捨

- 把巨集定義搬進 `route()` 裡、放在 `let mut cmds` 之後，也能找到 `cmds`，但巨集就只能在這個函式裡用，而且依賴外面剛好有個叫 `cmds` 的變數
- 明確傳參數比較囉嗦，但巨集可以在任何地方、對任何名字的行囊使用
"""

hints = [
  "錯誤說找不到 cmds：巨集定義的位置看得到 route() 裡的區域變數嗎？",
  "巨集本體裡的區域變數名稱屬於巨集自己（巨集衛生）；呼叫端的變數名得從參數傳進去，matcher 要多收一個 $bag:ident",
  "兩個巨集都要從參數拿到呼叫端的 Vec：matcher 多收的那個片段，本體要用它取代哪個名字？巨集改完之後，route() 裡的每個呼叫要多傳什麼？",
]

