id = "16-relic-struct"
chapter = 4
order = 16
title = "導遊卷軸"
kind = "build"
visual = "memory"

story = """
遺跡的古碑太重搬不動，我決定做一卷導遊卷軸帶海鷗參觀。
卷軸不抄原文，只記下「古碑在哪」，看的時候直接指著古碑念。
導覽結束卷軸就收起來，但海鷗要把找到的句子記在腦袋裡帶走。
"""

concept = """
## struct 也可以持有參考

- `struct Guide<'a> { text: &'a str }`：卷軸借用原文，不擁有
- `'a` 的意思：**Guide 不能比它借用的原文活得久**
- 好處：建立卷軸零複製；代價：原文必須一直活著，卷軸也不能被帶到原文消失之後

## impl 區塊要宣告同一個 `'a`

- `impl<'a> Guide<'a>`，方法裡的 `&'a str` 就是「原文的生命週期」

## 省略規則遇上 `&self`

- `fn line_count(&self) -> usize`：沒有回傳參考，不需要標註
- 若寫成 `fn find(&self, keyword: &str) -> Vec<&str>`，省略規則會讓回傳值借自 **`&self`（卷軸）**
- 那樣卷軸一收起來，找到的句子就跟著失效
- 寫成 `Vec<&'a str>`：句子借自**原文**，卷軸丟了也沒關係

## 函式簽名

- `fn tour<'a>(text: &'a str, keyword: &str) -> (usize, Vec<&'a str>)`
- 有兩個參考輸入，省略規則不適用，所以要標出「回傳的句子借自 text」
"""

hints = [
  "卷軸只存一個參考：new 拿到的 text 要放進 Guide 的哪個欄位？str 有沒有現成的方法，能一行一行走過原文？",
  "find 的迴圈裡，line 是原文的 &'a str 切片，用 line.contains(keyword) 判斷後 push 進 found",
  "不要把 find 的回傳型別改成 Vec<&str>：tour 裡的 guide 是區域變數，回傳的句子必須借自原文而不是卷軸",
]

