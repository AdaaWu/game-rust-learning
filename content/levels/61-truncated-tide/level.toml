title = "被截斷的潮位"
kind = "debug"
visual = "grid"

story = """
第二道試煉是一條沙洲，每一欄都插著潮位感測器，水太深的地方我得爬上礁岩高地繞過去。
我把讀數換成潮位刻度印在主控台上，除了一欄是 180，其他都在安全範圍內，我就放心地往前走。
結果第二步就一頭撞進被淹沒的沙洲，程式沒有 panic，連一則警告都沒有。
感測器明明讀到 300 公分，怎麼換算完只剩 44？
"""

concept = """
## as 轉型：無聲截斷

- `as` 在整數之間轉換**永遠成功**，裝不下的部分直接丟掉高位元
  - `300_u32 as u8` → 300 = 256 + 44，留下 **44**
  - `256_u32 as u8` → **0**
- 不會 panic、不會警告：溢位檢查只管加減乘，**不管 `as`**
- 結果是「看起來合理的錯誤數字」，比 panic 更難抓

## TryFrom：可能失敗的轉換

- `u8::try_from(x)` 回傳 `Result<u8, TryFromIntError>`：裝得下是 `Ok`，裝不下是 `Err`
- `.map_err(|_| TideError { raw })` 把標準庫的錯誤換成這關自己的錯誤型別，並帶上原始讀數
- 呼叫端用 `match` 決定怎麼處理錯誤：這關是「看不懂的讀數一律當作淹水」，寧可繞路也不冒險

## 選擇與取捨

- `as`：只在**確定裝得下**時用，例如 `u8 as u32`（變寬永遠安全）
- `try_from`：來源不可信（感測器、使用者輸入、檔案）時用，錯誤要讓呼叫端看見
- `min(255)` 夾住上限：值變成「剛好最大」，原本超出範圍這件事就被藏起來了

## Debug 心法

- 沒有 panic 的錯誤，從**輸出的數字**找矛盾：印出來的值和你預期的差多少？
- 300 變 44、256 變 0：差的剛好是 256 的倍數，就是 `u8` 截斷的指紋
"""

hints = [
  "主控台印出的潮位和 TIDES 裡的讀數對得上嗎？300 和 256 那兩欄變成了多少？",
  "u8 最大只到 255，as 遇到裝不下的數字不會報錯，只會把多出來的部分丟掉",
  "標準庫有一個「裝得下才給 Ok」的轉換，再用 map_err 把它的錯誤換成 TideError 並帶上原始讀數",
]

