  "entry(k).or_insert(0) 回傳的是 &mut u32，對它解參考就能加一；group_by_isle 的值是 Vec，or_default() 會先放一個空 Vec",
  "leaderboard 先把 ledger.iter() 收集成 Vec，再用 sort_by 比數量（b 對 a），數量相同時用 then_with 比名稱（a 對 b）",
]

