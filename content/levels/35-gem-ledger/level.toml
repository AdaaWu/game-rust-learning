story = """
市集的寶石商人把帳本交給我：每找到一顆寶石，就要記上一筆。
他還要知道每座島各出了哪些寶石，月底再排一張排行榜貼在攤位前。
商人抱怨這本帳很怪，每次翻開，寶石的順序都不一樣。
排行榜可不能這樣，今天貼的和明天貼的要一模一樣。
"""

concept = """
## entry：一次查找完成「沒有就建、有就改」

- `ledger.entry(key)`：先找到這個鍵的位置，回傳 `Entry`（可能有值、可能沒有）
- `.or_insert(0)`：沒有就放入 0；不管原本有沒有，都回傳那一格的 **`&mut u32`**
- `*count += 1`：透過可變參考直接改帳本裡的值
- `.or_default()`：放入型別的預設值（`u32` 是 0、`Vec` 是空 Vec），常用在分組：`groups.entry(isle).or_default().push(gem)`
- 回傳的 `&mut V` 借用著整本帳本，用完之前不能再碰 `ledger`

## 取捨：get 再 insert

- 寫法：`let n = ledger.get(&k).copied().unwrap_or(0); ledger.insert(k, n + 1);`
- 結果一樣，但要算兩次雜湊、找兩次位置；`entry` 只找一次
- 值是 `Vec` 時更明顯：`get` 拿到的是 `&Vec` 不能 push，只好複製一份再放回去

## HashMap 沒有順序 → 轉成 Vec 再排序

- 走訪 HashMap 的順序每次執行都可能不同，排行榜要先收集成 `Vec<(String, u32)>`
- `sort_by(|a, b| ...)`：closure 回傳 `Ordering`（`Less`、`Equal`、`Greater`）
  - 多到少：`b.1.cmp(&a.1)`，把 `a`、`b` 對調就是反過來排
  - 同數量再比名稱：`.then_with(|| a.0.cmp(&b.0))`，前一個比較是 `Equal` 才會比
- 另一種寫法：`sort_by_key(|r| (Reverse(r.1), r.0.clone()))`，tuple 由左到右逐欄比較
  - 代價：每次比較都 `clone` 名字；`sort_by` 不用
- `String` 的大小比較是逐位元組比 UTF-8，中文字依 Unicode 碼位排，不是依筆畫或注音
"""

hints = [
