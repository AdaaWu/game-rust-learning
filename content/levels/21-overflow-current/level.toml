story = """
最後一個漂流瓶裡是一張海流圖，照著往左游，每段終點都躺著一顆珍珠。
我寫了程式先算落點：會被沖出岸邊的那一段就跳過，抓緊岩石等下一段。
結果游到第三段，算出來的座標不是 -1，而是整片海流倒灌，我被捲進漩渦裡。
編譯器好像早就提醒過我什麼，可是我沒在看……
"""

concept = """
## usize 不能是負的

- `usize` 是**無號整數**，最小值就是 0
- `2 - 4` 在數學上是 -2，但 `usize` 裝不下
- debug 編譯（測試與 Run 都是）遇到溢位直接 **panic**：`attempt to subtract with overflow`
- release 編譯則會**繞回**成一個超大的數字，錯得更安靜

## 為什麼 `x - n < 0` 擋不住

- 減法先算完才比較，溢位在比較之前就發生了
- 而且 `usize` 永遠 `>= 0`，這個比較永遠是 false
- 編譯器會警告：`comparison is useless due to type limits`

## 先檢查、再減：checked 系列

- `x.checked_sub(n)`：成功回傳 `Some(結果)`，會溢位回傳 `None`
- 剛好就是「游得到就給位置，游不到就 None」
- 其他選擇與取捨
  - `saturating_sub`：卡在 0，適合「最多退到岸邊」的語意，但會吃掉「其實過頭了」這個資訊
  - `wrapping_sub`：故意繞回，只適合雜湊、亂數這類需要模運算的場合
  - 改用 `i32`：可以是負數，但之後當索引時又要轉回 `usize`

## Debug 心法

- panic 訊息會告訴你是**減法溢位**，再看編譯警告指著哪一行
"""

hints = [
  "先看編譯警告：有一個比較「永遠不會成立」，它指著哪一行？",
  "x - n 在 x 比 n 小的時候就已經 panic 了，根本輪不到和 0 比較",
  "標準庫有一個「會失敗就回傳 None」的減法，回傳型別剛好和 back_off 一樣",
]

