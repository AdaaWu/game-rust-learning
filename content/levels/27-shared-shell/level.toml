story = """
洞窟深處有一間好大的粉紅螺殼，我和阿殼、小紅決定一起住。
上一關的 Box 只能有一個主人，可是這間屋子我們三隻都要拿鑰匙。
海鷗提醒我：「別傻傻再蓋三間一樣的房子，打三把鑰匙就好。」
"""

concept = """
## Rc：多個擁有者共用同一份資料

- `Rc<T>`：**Reference Counting（參考計數）** 智慧指標，資料放在 heap，旁邊記一個 **strong count**
- `Rc::clone(&rc)`：**不複製資料**，只把 strong count 加 1，拿到另一把指向同一處的鑰匙
- 任何一個 `Rc` 被 drop，strong count 減 1；歸零時才真正釋放 heap 資料

## 觀察計數

- `Rc::strong_count(&rc)`：目前有幾個 `Rc` 指著這份資料（包含你手上這個）
- `Rc::ptr_eq(&a, &b)`：兩把鑰匙是不是開同一扇門

## 移出欄位也是 move

- `let Crab { home, .. } = crab;` 把 `home` 從 `crab` 裡**搬出來**：只是換手，計數不變
- 其他欄位（例如 `name`）在這裡就被 drop

## 取捨

- 優點：多個擁有者，誰最後離開誰負責釋放
- 代價：每次 clone／drop 都要更新計數；`Rc` 只給**共享參考**，不能直接修改內容（要改得配 `RefCell`，下一關）；只能在單一執行緒用
"""

hints = [
  "三個 todo!() 都和 strong count 有關：誰手上拿著 Rc，誰就算一把鑰匙",
  "move_in 不要重蓋一間 Shell，home 欄位用 Rc::clone(home)；keys 用 Rc::strong_count",
  "move_out 先把 home 從 crab 搬出來，這時 home 自己也算一把鑰匙，回傳的計數要扣掉它",
]

