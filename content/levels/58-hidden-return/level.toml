concept = """
## 巨集展開的 `return` 屬於呼叫端

- 巨集不是函式：展開後的程式碼**直接貼進呼叫端**
- 所以巨集裡的 `return`，回傳的是**呼叫端那個函式**，不是巨集自己
- 本關的 `step_or_bail!` 在 `chant()` 的迴圈裡展開，遇到壞咒語時 `return $chant`，整個 `chant()` 就提早結束
- `?`、`break`、`continue` 也一樣：寫在巨集裡，就會影響呼叫端的控制流程

## 為什麼這很危險

- 呼叫端看到的只是一行 `step_or_bail!(chant, spell);`，看不出這裡會離開函式
- 沒有 panic、沒有 warning，型別也完全正確，編譯器幫不上忙
- 好的巨集要讓控制流程看得見：要提早離開，就把 `Result` 交回呼叫端，讓呼叫端自己寫 `?` 或 `return`

## 本關規格

- 遇到壞咒語：**略過這一步**，把原文記進 `skipped`，後面的咒語照常唸完
- 正解：`Err(bad) => $chant.skipped.push(bad)`，巨集裡不跳出任何東西
- 測試會在巨集**之後**再接著做事，巨集偷偷跳出去就會被抓到

## Debug 心法

- 這關的線索只有畫面：Ferris 走到一半就停，停點正好在壞咒語前
- 「停在某個輸入前面」通常代表提早離開：找找 `return`、`break`、`?`，**巨集展開後的也算**
"""

hints = [
