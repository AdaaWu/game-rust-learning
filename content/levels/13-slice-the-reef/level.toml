concept = """
## slice：借用一段連續資料

- `&str` 是**字串切片**：一個指標加一個長度，指向別人擁有的 UTF-8 bytes
- `&map[2..6]` 不複製任何字元，只是「從第 2 個 byte 起看 4 個 byte」
- `&[u32]`、`&[String]` 同理：`&v[1..]` 借用 Vec 的後半段
- 參數寫 `&str` / `&[T]` 比寫 `&String` / `&Vec<T>` 更通用：String、字串常值、Vec、陣列都能傳進來

## `String` 與 `&str`

- `String`：擁有 heap 上的資料，可以增長
- `&str`：只借不擁有，不能增長；字串常值 `"~~##"` 也是 `&str`

## `Copy` 與 `Clone`

- `u32`、`bool`、`char` 這類**`Copy`** 型別「按位元複製一份就完整」，也沒有需要釋放的資源，所以 `let max = depths[0];` 直接複製一份，原本的還在
- `Copy` 與資料放在 stack 或 heap 無關：`depths` 的 `u32` 其實放在 Vec 的 heap 上，照樣能 Copy
- 區域變數 `String` 的指標、長度、容量放在 stack，卻不能 Copy：它擁有 heap 資料，drop 時要釋放，按位元複製會變成兩個擁有者
- `String` 不是 `Copy`：`crew[0]` 不能被「搬出」借來的 slice，要用 `.clone()` 明確複製 heap 資料
- 取捨：`Copy` 便宜而且是隱式的；`Clone` 可能很貴，所以 Rust 要你寫出來

## 注意

- slice 的索引是 **byte**，不是「第幾個字」；本關地圖只有 ASCII，一個字剛好一個 byte
- 中文一個字佔 3 個 byte，切錯位置會怎樣？第 4 章最後會遇到
"""

hints = [
