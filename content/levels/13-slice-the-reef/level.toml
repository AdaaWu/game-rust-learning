  "deepest 的 d 是 &u32，用 *d 取值比較和更新 max；u32 是 Copy，取出來不影響原本的 slice",
  "first_mate 回傳 crew[0].clone()：String 不是 Copy，不能直接從借來的 slice 裡搬走",
]

