我畫了一張珊瑚礁地圖，寄居蟹只需要看中間那一段。
整張抄一份給牠太浪費，我只想指著原圖說「看這裡」。
還有水深表和隊員名單要處理：有的東西隨手就能複製，有的得認真抄一份。
