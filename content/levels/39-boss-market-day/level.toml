concept = """
## 本章複習

- **FromStr**（第 36 關）：`line.parse::<Trade>()` 把一行紀錄變成型別；`?` 把 `Err` 往上傳
- **entry**（第 35 關）：`entry(k).or_insert(初始值)` 只在**第一次**遇到這個鍵時放入初始值
- **HashMap 沒有順序**（第 34、35 關）：走訪順序每次執行都可能不同，需要順序就自己排
- **走訪時修改**（第 37 關）：索引 `remove` 讓後面的元素左移，下一個元素會被跳過；`retain` 一次處理完

## 多個 bug 疊在一起

- 每個 bug 的症狀不同，有的只在特定資料才出現
  - 只在攤位**第一次出現**時多算的錯，看起來像「偶爾差一點」
  - 只在**相鄰兩個**都符合條件時才漏掉的錯，資料一換就消失
  - 依賴 HashMap 走訪順序的錯，**每次執行結果都不同**
- 修好一個，另一個的症狀可能才看得清楚

## Debug 心法

- 先分類症狀：數量錯？順序錯？該消失的沒消失？
- 每個測試只檢查一件事，失敗訊息會直接說是哪一類
- 「同樣的程式跑兩次結果不同」幾乎都是在依賴沒有保證的順序（HashMap 走訪、執行緒交錯）
- 一次只修一個，修完就 Submit，看剩下哪些測試還紅
"""

