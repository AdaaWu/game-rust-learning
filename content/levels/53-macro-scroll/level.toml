story = """
走出 Trait 迷宮，出口是一間堆滿捲軸的咒語工坊。
老巫師說這裡的捲軸會在**編譯時**自己展開：寫一句 `steps!(RIGHT, 2)`，就變成兩行 `MOVE RIGHT`。
捲軸上的咒語本體還是空白，得先把它們刻好，我才能照著唸出來的路走。
