concept = """
## macro_rules!：在編譯時展開程式碼

- `macro_rules! steps { (matcher) => { transcriber }; }`：左邊比對呼叫時寫的語法片段，右邊是要展開成的程式碼
- 呼叫時要加 `!`：`steps!(RIGHT, 2)`；括號用 `()`、`[]`、`{}` 都可以，例如 `route![...]`
- 展開發生在**編譯期**：型別檢查看到的是展開後的程式碼，執行期沒有「呼叫巨集」這件事

## 片段指示符（fragment specifier）

- `$dir:ident`：一個識別字，例如 `RIGHT`、`PICK`
- `$n:expr`：一個運算式，例如 `2`、`k`、`a + 1`
- `stringify!($dir)`：把語法片段變成字串字面值，`stringify!(RIGHT)` 得到 `"RIGHT"`

## 多條規則：由上而下比對

- 一個巨集可以有好幾條規則，用 `;` 分開
- 編譯器從第一條開始試，**第一條吻合的**就展開，後面不再看
- 所以特殊規則 `(PICK, $n:expr)` 要放在通用規則 `($dir:ident, $n:expr)` 前面

## 重複：`$( ... ),*`

- matcher 寫 `$($word:ident $n:expr),*`：比對零組以上「識別字 運算式」，組與組之間用逗號分開
- transcriber 寫 `$( ... )*`：每一組展開一次，裡面可以用 `$word`、`$n`
- 巨集可以呼叫別的巨集（例如 `route!` 裡呼叫 `steps!`），也可以呼叫一般函式

## 巨集 vs 函式

- 函式：參數數量固定、每個參數都是**值**、有型別
- 巨集：參數數量可變、吃的是**語法片段**（`RIGHT` 根本不是一個值）、在編譯期展開
- 取捨：巨集能消除重複的語法，但錯誤訊息較難讀、編輯器支援較弱；能用函式解決就先用函式
"""

hints = [
  "steps!(RIGHT, 2) 要變成什麼型別的值？如果寫成函式，你會怎麼產生 n 個相同的字串？",
  "stringify!($dir) 會得到 \"RIGHT\" 這種字串；(0..$n).map(...).collect::<Vec<String>>() 可以產生 n 個指令",
  "route! 要接住好幾組 $word, $n：重複區塊怎麼寫？每一組都能交給 steps! 產生一段指令，要接到哪裡才能合成一條路線？展開結果要放在 let 的右邊，外層還缺什麼？",
]

