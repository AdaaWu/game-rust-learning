story = """
學會 iterator 之後，我得意地把寶石統計也改成一條流水線。
我跑遍三片海灘、撿了滿滿一袋，回來一看：計數器 0，日誌一行都沒有。
程式沒有 panic、也沒有編譯錯誤，只有一則黃色的警告靜靜躺在那裡。
