story = """
遺跡最深處立著最後一排古碑，解讀出來的字就是離開遺跡的咒語。
我寫的解讀器在海灘上試過英文石板，一個字都沒錯。
可是這裡的古碑全是中文，第一塊才念到一半，解讀器就碎成了沙。
"""

concept = """
## String 是 UTF-8 bytes

- `String` / `&str` 內部是 **UTF-8 編碼的 byte 序列**
- 英文字母 1 個 byte；中文字通常 **3 個 byte**；emoji 4 個 byte
- `len()` 回傳 **byte 數**，不是字數；字數要用 `chars().count()`

## 切片的索引是 byte

- `&s[a..b]` 的 `a`、`b` 是 byte 位置
- 切在一個字的中間，執行期 panic：byte index is not a char boundary
- 編譯器擋不住，因為索引是執行期才知道的數字

## 找到「第 n 個字」的 byte 位置

- `char_indices()` 依序產生 `(byte 位置, 字元)`
- 搭配 `enumerate()` 就知道「第幾個字從第幾個 byte 開始」
- 位置超過最後一個字時，用 `len()`（字串結尾）當邊界

## 本章工具箱

- 回傳 `&'a str` 切片：零複製，而且只借原文，不借暫時的解讀器
- 擁有權：`decode` 把多段借來的切片 `join` 成一個新的 `String` 交出去
"""

hints = [
  "古碑「蟹王之墓」有幾個字？char_count 算出來的是幾？兩件事其實是同一個誤會",
  "切片的索引是 byte，「蟹」佔 0..3；要先把「第幾個字」換算成 byte 位置，再切",
  "工具介紹：s.char_indices() 會依序給出每個字的 (byte 位置, 字元)，「蟹王」得到 (0, '蟹')、(3, '王')；它是 iterator（第 24 關正式教），現在先當成能放進 for 迴圈逐一走過的序列，接上 .enumerate() 就多一個「第幾個字」的計數",
  "寫一個 byte_at(idx)：用 char_indices().enumerate() 找到第 idx 個字的 byte 位置，找不到就回傳 self.text.len()；excerpt 改用它切，char_count 改用 chars().count()",
]

