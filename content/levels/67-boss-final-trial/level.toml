story = """
最終試煉！海鷗、寶物箱和古碑都在場邊看著，我坐鎮指揮部，派三隊螃蟹出海偵察寶石。
各隊回來把座標寫上回報板，我照隊號整理好，排出最後一條路線。
可是按下 Run，主控台停在「等各隊回來」就再也不動了，三隊螃蟹好像被關在門外。
海鷗說這支程式裡不只一個 bug，修好一個，下一個才會現身。幫我走完這最後一段路。
