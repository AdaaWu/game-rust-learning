concept = """
## 這關沒有新觀念，只有你學過的全部

- 不告訴你 bug 在哪，只給線索：主控台、測試失敗訊息、Ferris 在地圖上停下的位置
- 程式拆成兩個模組：`scout`（偵察隊）與 `command`（指揮部），測試以 `scout::`、`command::` 路徑呼叫；外部要用的項目都已經是 `pub`

## 鎖要拿多久（第 31、33 關）

- `MutexGuard` 活多久，鎖就被拿多久；`let x = m.lock().unwrap();` 會一直拿到**這個變數離開作用域**
- 拿著鎖去等別人，而別人正好需要那把鎖才能做完：這就是死鎖，沒有 panic，程式只是卡住
- 原則：**先等、再拿鎖**，或用區塊 `{ }`、`drop(guard)` 把持有時間縮到最短

## 不要吞掉錯誤（第 19、43 關）

- `.ok()` 把 `Err` 變成 `None`，再用 `if let Some` 略過：錯誤就**無聲消失**
- 看不懂的回報應該讓呼叫端知道是哪一隊：`map_err` 換成自己的錯誤型別，再用 `?` 往外傳

## HashMap 沒有順序（第 9 章）

- `HashMap` 的走訪順序取決於雜湊，**每次建立都可能不同**：連按兩次 Run，路線可能不一樣
- 需要固定順序時：用 `BTreeMap`（依鍵排序），或收集成 `Vec` 後 `sort`

## as 轉型的陷阱（第 60、61 關）

- `(-1_i64) as usize` 不會失敗，而是變成 `18446744073709551615`
- 只檢查上界 `x < WIDTH` 擋不住負數：`usize::try_from(x)` 失敗就代表在海圖外

## 為檢查函式補上測試（第 42、45 關）

- `check_to_cell` 是你寫給 `to_cell` 的檢查：好檢查的定義是「**錯的版本傳進來會 panic**」
- 判題會把好幾個錯誤版本傳給它，每一個都要抓到；正確的版本則不可以 panic
- 想想邊界：負數、等於寬高的那一格、最右一欄、最下一列、x 與 y 有沒有對調

## Debug 心法

- 先 Run：卡住時主控台最後一行，就是程式停下來的地方
- 一次修一個，修完重新 Submit，看失敗的測試換成哪一個
- 修好全部之後再 Run 兩次，確認路線每次都一樣
"""

