concept = """
## 錯誤處理的交易性

- 交易性（transactional）：一個操作要嘛**全部完成**，要嘛**完全沒發生**，不留下半套狀態
- 這關的 `append_floor` 邊解析邊 `push`：遇到裂縫才回傳 `Err`，前半段指令已經寫進 `cmds`
- 呼叫者看到 `Err`，以為「什麼都沒發生」就改走備案，結果備案接在殘骸後面
- `?` 只負責「提早 return」，不會幫你把已經做的修改還原

## 兩種修法

- 先組好再交出去：在區域變數裡組完整層的指令，全部成功才 `cmds.extend(built)`
- 先驗證再修改：先確認每個字元都合法，再開始 `push`
- 也可以失敗時 `cmds.truncate(原本長度)` 還原，但每條 return 路徑都要記得做，容易漏
- 取捨：先組好再交出去多一個暫存 `Vec`，換來「任何地方提早 return 都安全」

## 為什麼這種 bug 難找

- 每一步單獨看都合法：每個指令都是真的指令，錯誤也有正確回報
- 錯的是**順序與殘留**：只有把整條路線攤開，才看得出前幾行不屬於任何一份計畫
- 這也是 `&mut` 參數的代價：函式能修改呼叫者的資料，失敗時也一樣

## Debug 心法

- 看畫面：Ferris 第一次走錯是在哪一層、多走了哪幾步？
- 對照主控台和 `FLOORS`：多出來的指令是哪一份樓梯圖的前半段？
- 主樓梯在**開頭**就裂開時不會出事，只有**中間**裂開才會留下殘骸
"""

