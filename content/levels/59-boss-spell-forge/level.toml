story = """
工坊最深處是一座咒語熔爐，把整卷咒語熔成一行行指令，還會替每種寶石記帳。
巫師要我帶著熔好的路線去撿兩顆珍珠和一顆海玻璃，帳本也要對得上。
可是熔爐只吐出第一段路，我才走兩步就停了，帳本上一顆寶石都沒有。
這是工坊的最後一關，幫我把熔爐修好。
"""

concept = """
## 綜合複習：巨集的三個陷阱

- **隱藏的控制流程**（第 58 關）：巨集裡的 `return` 會讓呼叫端的函式提早結束
- **重複求值**（第 57 關）：transcriber 寫幾次 `$e`，參數就執行幾次，副作用跟著重複
- **規則與片段**（第 53–56 關）：巨集展開的是程式碼，要用「展開後長什麼樣子」去想

## 複習 HashMap 與 entry（第 9 章）

- `*tally.entry(kind).or_insert(0) += 1`：沒有這個 key 就先放 0，再把計數加一
- 帳本被加了幾次，取決於 `weigh` 被**呼叫**了幾次，不是寶石有幾顆

## 複習 Display（第 9 章）

- `impl fmt::Display for Spell` 決定 `spell.to_string()` 的結果
- `"PICK "` 和 `"PICK"` 差一個結尾空白，`==` 比較就是不相等；畫面上卻幾乎看不出來
- 字串比對出錯時，用 `{:?}` 印出來，引號會把空白現出原形

## Debug 心法

- 一次只修一個 bug，修完就再 Run、再 Submit，看症狀換成什麼
- 三個 bug 會一個接一個浮現：前一個沒修好時，後一個的症狀被蓋住
- 看主控台的帳本那一行和畫面上 Ferris 有沒有彎腰撿寶石，比對測試訊息
"""

