story = """
第三道試煉在一道海溝裡：寶石沉在 0.3、0.7、0.8 公尺深的地方，我得一格一格往下潛。
我邊潛邊報深度，到了寶石的深度就撿起來，最後往右游上岸。
結果我游到岸邊才發現，袋子裡只有一顆寶石，另外兩顆我明明經過了。
主控台寫著我潛到了 0.30000000000000004 公尺……這到底算不算 0.3？
"""

concept = """
## 浮點數不精確

- `f64` 用二進位存小數，**0.1 在二進位是無限循環小數**，只能存一個最接近的近似值
- 近似值一路累加，誤差也跟著累加：`0.1 + 0.1 + 0.1` 得到 `0.30000000000000004`
- 所以 `0.1 + 0.2 == 0.3` 是 **false**；有時候碰巧相等（這關的 0.7），反而讓 bug 更難發現
- 不會 panic、不會警告：程式只是「差一點點」沒對上

## 比較浮點數：用誤差範圍

- 改問「夠不夠接近」：`(a - b).abs() < EPS`
- `EPS` 要依**問題本身的精度**挑選，例如深度計精度 1e-9 公尺
  - 太大（例如 0.05）：0.3 和 0.31 也被當成一樣
  - 太小（例如 `f64::EPSILON`）：`f64::EPSILON` 是「1.0 附近」相鄰兩個 f64 的間距，數值越大、累加越多，誤差就超過它
- 另一種做法：改用**整數單位**（公分、毫米）存，整數加法沒有誤差；取捨是要先決定最小單位

## 選擇與取捨

- 金額、計數這類「本質是整數」的量：用整數（分、公分）最可靠
- 物理量、比例：用 `f64` 加誤差範圍，誤差範圍寫成具名常數並說明單位
- 永遠不要對累加出來的浮點數用 `==`

## Debug 心法

- 沒有 panic 時，把中間值印出來：主控台上 `0.30000000000000004` 就是線索
- 比對「碰巧對的」和「沒對到的」：同樣的寫法，為什麼 0.7 撿到了、0.3 和 0.8 沒撿到？
"""

