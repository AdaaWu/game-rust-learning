  "結尾逗號比不到？重複的逗號只當分隔符。再加一個只裝逗號的重複區塊，次數用「零或一次」接在最後；展開內容外面多包一層 {{ ... }} 才會是一個區塊運算式",
  "max_of! 要兩條規則：一條接住「只剩一個」並直接交出它，另一條把第一個和 $($rest:expr),+ 分開，剩下的交給 max_of! 自己算出最大，再用 > 和第一個比。小數只能用 >，不能靠 max()",
]

