concept = """
## 重複：片段、分隔符、次數

- 重複的寫法是 `$( 每組的樣子 ) 分隔符 次數`；分隔符可以省略
- 次數有三種：`*` 零次以上、`+` 一次以上、`?` 零或一次
- 例：`$($n:expr),*` 比對 `1, 2, 3`；每組可以有好幾個片段，片段之間也能夾字面符號（像 `=>`、`:`）
- 分隔符只出現在**兩組之間**：`1, 2, 3,` 最後那個逗號後面沒有下一組，比對會失敗
- 重複區塊裡也可以只放字面符號、不放任何 `$名稱`；搭配「零或一次」，就是「這個符號可有可無」
- 想一想：`atlas!` 和 `max_of!` 的比對規則要怎麼組，才能同時接受「有」和「沒有」結尾逗號？

## 展開成區塊運算式

- transcriber 寫 `{{ let mut m = HashMap::new(); $( m.insert(...); )* m }}`
  - 外層 `{}` 是規則的界線，內層 `{}` 讓展開結果變成**一個區塊運算式**，最後一行 `m` 就是它的值
  - 少了內層 `{}`，`let` 會直接散落在呼叫端，`let atlas = atlas!{...};` 就不成立
- `atlas!{}` 零組時，`m` 從頭到尾沒被改過，會出現 `unused_mut` 警告；可在 `let` 上加 `#[allow(unused_mut)]`
- 呼應第 9 章：`HashMap<String, (i32, i32)>` 的 key 是擁有所有權的 `String`，所以要 `$key.to_string()`

## 遞迴巨集

- `max_of!(a, b, c)` 拆成「第一個」和「剩下的」：第一個用一個 `expr` 片段接住，剩下的用重複接住，再交給 `max_of!` 自己
- 終止條件：只剩一個 `$x` 時，答案就是 `$x`
- 規則順序很重要：單一元素的規則要能接住最後一個，不然遞迴停不下來
- 每層用 `let a = $x;` 先算出值，再和 `max_of!(剩下的)` 比較

## 為什麼不用陣列的 max()

- 陣列寫法 `[$($x),+].into_iter().max().unwrap()` 只展開一次、更好讀，但 `Iterator::max` 要求元素實作 `Ord`
- `f64` 只有 `PartialOrd`（`NaN` 和誰都比不出大小），所以 `max_of!(1.5, 3.25)` 用陣列寫法會編譯失敗
- 本關的 `max_of!` 要同時吃整數和小數，遞迴展開成 `>` 比較只需要 `PartialOrd`，兩種都能用
- 取捨：遞迴巨集有展開深度上限（預設 128 層），參數很多時要留意
"""

hints = [
