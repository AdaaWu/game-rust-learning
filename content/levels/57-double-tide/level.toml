story = """
工坊外的潮汐會一道一道唸出咒語，我用 `log_step!` 邊唸給海鷗聽、邊記進行囊。
可是主控台上「潮汐唸出」的指令，和我實際走的指令怎麼對都對不起來，我一出發就撞上岩石。
海鷗數了數：「潮汐明明有十道咒語，後面卻唸出一堆空白，你的行囊也只記了一半。」
"""

concept = """
## `$e:expr` 是程式碼，不是值

- 函式呼叫 `f(tide.next())`：參數先算好一次，函式拿到的是**值**
- 巨集呼叫 `log_step!(cmds, tide.next())`：`$e` 換成的是 `tide.next()` 這段**程式碼**
- transcriber 寫了幾次 `$e`，展開後就有幾份 `tide.next()`，**每一份都會執行**

## 副作用被重複

- 本關的 `log_step!` 先 `println!("…{}", $e)` 再 `$cmds.push($e)`：潮汐被叫了兩次
- 唸出來的是第 1 道，記進行囊的卻是第 2 道；下一輪唸第 3 道、記第 4 道……
- 只要參數有副作用（`next()`、`+= 1`、讀檔、亂數），就會出錯；傳普通變數時看不出來

## 正解：展開開頭只求值一次

- transcriber 第一行寫 `let step = $e;`，之後都用 `step`
- 巨集衛生保證這個 `step` 不會和呼叫端的同名變數打架
- 這也是標準函式庫巨集的寫法：`assert_eq!`、`dbg!` 都先把參數綁到區域變數

## Debug 心法

- 先 Run：比對「潮汐唸出：」那幾行和下面 Ferris 真正走的指令，看出每隔一道就少一道
- 懷疑巨集時，在腦中（或紙上）把呼叫展開一次，數一數 `$e` 出現幾次
"""

hints = [
