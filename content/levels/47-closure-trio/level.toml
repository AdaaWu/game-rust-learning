story = """
迷宮第二道門前，老龍蝦要我示範三種鉗法：看、捏、交出去。
看一眼貝殼很簡單，可是要捏三下記在本子上、把珍珠交出去時，編譯器都不准。
老龍蝦說：「你把三種鉗子都當成只能看的那一種了。」
我得替 `repeat` 和 `deliver` 各挑一把對的鉗子。
"""

concept = """
## closure 依「怎麼用捕捉到的東西」自動實作 Fn 家族

- `Fn`：只**讀**捕捉的變數（共享借用），可以呼叫很多次，例：`|| println!("{}", shell)`
- `FnMut`：會**改**捕捉的變數（可變借用），可以呼叫很多次，但呼叫時要 `&mut`，例：`|| log.push(..)`
- `FnOnce`：會把捕捉的東西**交出去**（取走所有權），只能呼叫一次，例：`move || gem`
- 編譯器看 closure 內容決定它「最多」能實作哪幾個；呼叫端的 bound 決定「要求」哪一個

## 三者的包含關係

- 每個 `Fn` 都是 `FnMut`，每個 `FnMut` 都是 `FnOnce`
- 所以 bound 越寬鬆，能收的 closure 越多：`FnOnce` 收全部，`Fn` 只收只讀的
- 代價在函式內部：拿到 `FnOnce` 只能呼叫一次；拿到 `FnMut` 要把參數宣告成 `mut f`

## 怎麼挑 bound：最寬鬆且夠用

- `repeat` 要呼叫 n 次 → 不能用 `FnOnce`；不需要只讀保證 → 用 `FnMut`
- `deliver` 只呼叫一次 → 用 `FnOnce`，連會交出所有權的 closure 都收
- `Fn` 留給真的需要「同時被很多人呼叫」的情況（例如共享給多條執行緒）

## 讀懂這兩個錯誤

- **E0596**：cannot borrow `log` as mutable, as it is a captured variable in a `Fn` closure → closure 想改東西，但 bound 只給 `Fn`
- **E0507**：cannot move out of `gem`, a captured variable in an `Fn` closure → closure 想把東西交出去，但 `Fn` 可能被呼叫第二次，交出去就沒了
- 兩個錯誤都指向 closure **裡面**，真正要改的卻是**函式簽名的 bound**
"""

hints = [
