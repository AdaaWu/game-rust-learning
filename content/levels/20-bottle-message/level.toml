story = """
導航修好後，我在礁石間撈到一整串漂流瓶，每個瓶子裡都塞著一行航海密語。
大部分寫著 `RIGHT 3` 這種「方向 步數」，可是有的被海水泡爛、有的方向是亂寫的。
我不想再看到「解析失敗」四個字就放棄，請幫我做一台會說清楚**錯在哪**的解讀機。
