concept = """
## Result：成功或失敗都寫進型別

- `Result<T, E>` 只有兩種值：`Ok(值)` 或 `Err(錯誤)`
- `"3".parse::<u32>()` 回傳 `Result<u32, ParseIntError>`，數字寫錯就是 `Err`

## 自訂 error enum

- 用 enum 列出所有失敗原因：`Empty`、`UnknownDir(String)`、`BadSteps(ParseIntError)`
- 每種錯誤可以帶資料，呼叫端能用 `match` 精準處理，而不是只拿到一句字串
- 取捨：字串錯誤寫起來快，但呼叫端無法分辨；enum 多寫幾行，換來可以 match 的錯誤

## ? 與 From

- 在回傳 `Result<_, BottleError>` 的函式裡，`x?` 遇到 `Err(e)` 會**立刻回傳**
- 回傳前會呼叫 `From::from(e)` 轉成函式宣告的錯誤型別
- 所以只要寫好 `impl From<ParseIntError> for BottleError`，`text.parse::<u32>()?` 就能直接用

## Option 轉 Result

- `words.next()` 回傳 `Option<&str>`
- `.ok_or(BottleError::Empty)` 把 `None` 換成指定的錯誤，之後就能接 `?`
"""

