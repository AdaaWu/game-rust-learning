id = "04-type-tides"
chapter = 1
order = 4
title = "潮汐表"
kind = "fix-compile"
visual = "grid"

story = """
巡完海岸，我在礁石上找到一張潮汐表，水位用 `u8` 記著，0 到 255 公分。
只要算出退潮時能往外走幾步，就能踩著礁石去撿最後一顆寶石，再下到沙灘的出口。
可是步數我用 `i32` 算，走路的函式又要 `usize`，三種整數吵成一團，程式根本編不過。
"""

concept = """
## 整數型別各有範圍

- `u8`：0–255，不能是負數；`i32`：約 ±21 億，可以是負數
- `usize`：無號整數，大小跟著機器走，**長度、索引、次數**都用它
- 型別推論：`let x = 3;` 沒寫型別時，編譯器依用法推斷，推不出來才預設 `i32`

## Rust 不會偷偷轉型

- 不同整數型別**不能直接混用**，編譯器回報 **E0308** mismatched types
- 用 `as` 明確轉換：`tide as i32`、`steps as usize`
- 無損的方向也可以用 `i32::from(tide)`，編譯器的 `help:` 常會建議 `.into()`

## 取捨：什麼時候轉、轉成什麼

- **先轉成夠大的型別再算**：`u8` 相減結果是負數時會 overflow，執行期直接 panic
- `as` 從大轉小、從有號轉無號會**靜默截斷**，例如 `-1i32 as usize` 變成超大的數
- 原則：在邊界轉一次，算的時候用能裝下所有結果的型別
"""

hints = [
  "編譯器回報兩個 E0308：一個在 steps_out 的回傳值，一個在 route 呼叫 walk 的地方",
  "steps_out 要能回傳負數（漲潮要往回退），u8 裝不下負數，所以要在相減之前就把 tide 轉成 i32",
  "steps_out 改成 (50 - tide as i32) / 10；route 裡 walk 的第二個參數改成 steps as usize",
]

