story = """
照著瓶中信的航線，我漂到了工匠之島，這裡的居民什麼工具都自己做。
島上的老工匠說：「不管你是爬的還是飛的，只要會移動，就是我們的夥伴。」
一路吐槽我的海鷗終於答應載我一程，牠拍一下翅膀就能飛兩格。
我們得先講好「夥伴」要會哪些動作，才能排成一支接力隊伍出發。
"""

concept = """
## trait：定義「會做什麼」

- `trait Mover { fn step(&self, dir: &str) -> Vec<String>; }`：只寫方法簽名，不寫內容
- trait 描述的是**能力**，不在乎是誰：螃蟹、海鷗、海龜都可以有

## impl Trait for 型別

- `impl Mover for Seagull { fn step(...) { ... } }`：替某個型別實作這份能力
- trait 裡沒有預設內容的方法，每個型別都**一定要**實作，少一個編譯器就拒絕（E0046）

## 預設方法

- trait 裡也可以寫有內容的方法，例如 `travel` 重複呼叫 `self.step`
- 每個實作者自動拿到，不必重寫；需要時也能覆寫
- 取捨：預設方法減少重複，但只能使用 trait 自己宣告的方法

## dyn Trait：不同型別放進同一個隊伍

- `Vec` 每個元素大小要一樣，`Ferris`、`Seagull` 是不同型別，不能直接放在一起
- `Box<dyn Mover>`：把夥伴放到 heap，`Vec` 裡只存**胖指標**（fat pointer：資料位址 + vtable 位址）
- `&dyn Mover`：借用版的胖指標，不必搬到 heap
- vtable（虛擬方法表）：每個「型別 × trait」一張表，記著 `name`、`step`、`travel` 的實際位址；`m.step(...)` 執行時先查表再跳過去

## 靜態分派 vs 動態分派

- 靜態分派：`Ferris.travel(...)`、`fn f(m: &impl Mover)`、`fn f<T: Mover>(m: &T)`
  - 編譯時**單態化**（monomorphization：替每個實際型別各產生一份程式碼），可 inline，執行期零額外成本
  - 代價：型別越多執行檔越大；一個 `Vec<T>` 只能裝同一種型別
- 動態分派：`&dyn Mover`、`Box<dyn Mover>`
  - 執行期查 vtable：多一次間接跳躍、通常無法 inline；`Box` 還要配置 heap
  - 好處：不同型別混在同一個集合，程式碼只有一份
- 怎麼選：型別在編譯時就確定 → 泛型；組合要到執行期才決定（隊伍名單、外掛）→ `dyn`
- 注意：`&impl Mover` 隱含 `Sized`，`&dyn Mover` 傳不進去；本關的 `announce` 因此寫成 `&dyn Mover`
- 限制：trait 要 dyn 相容（dyn compatible）才能寫 `dyn`，例如方法不能有泛型參數、不能回傳 `Self`
"""

hints = [
