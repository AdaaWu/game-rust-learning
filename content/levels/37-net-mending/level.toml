title = "補網的螃蟹"
kind = "debug"
visual = "memory"

story = """
漁網裡混了幾條腐壞的魚，我請一隻年輕的螃蟹把牠們挑掉。
牠一開始邊看邊丟，被編譯器罵了一頓，於是改用編號一條一條檢查，終於編譯過了。
結果網子一收，牠就大喊「網破了！」，整個工坊停擺。
幫我看看牠的編號是從哪裡開始數錯的。
"""

concept = """
## 走訪集合時修改它

- 直覺寫法：`for (i, f) in net.iter().enumerate() { if f.rotten { net.remove(i); } }`
  - 編譯器回報 **E0502**：`iter()` 正共享借用著 `net`，迴圈裡又要可變借用
  - 這是借用規則在保護你：一邊讀一邊改，讀到一半元素就搬家了
- 改用索引 `for i in 0..net.len()` 可以騙過編譯器：每次 `net[i]` 只是短暫借用
  - 但問題沒有消失，只是從編譯期延後到執行期

## 為什麼會出界

- `0..net.len()` 在迴圈**開始前就算好**，之後網子變短，範圍不會跟著變
- `remove(i)` 把後面的元素全部往左移一格，長度減一
  - 下一輪 `i + 1` 指到的是「原本的 i + 2」，原本的 i + 1 被跳過了
  - 連續兩條爛魚，第二條就會漏網
- 最後 `i` 追上已經變短的長度：`index out of bounds`

## 正解：retain

- `net.retain(|f| !f.rotten)`：保留 closure 回傳 `true` 的元素，一次走完、順序不變、**O(n)**
  - 對照：迴圈裡每次 `remove(i)` 都要搬動後面所有元素，最壞 **O(n²)**
- `HashMap::retain(|k, v| ..)`、`HashSet::retain` 也有同樣的方法
- 另一種做法：先收集要刪的東西，迴圈結束後再改；或建一個新 `Vec` 再指派回去

## 不要用 swap_remove

- `swap_remove(i)` 拿最後一個元素填洞，O(1) 很快，但**順序會亂**
- 題目要求好魚維持原本的順序

## Debug 心法

- panic 訊息的 `len` 和 `index` 告訴你：迴圈以為還有幾條，網子實際剩幾條
- 在記憶體圖上逐步看 `i` 指到哪一條魚，比在腦中模擬可靠
"""

hints = [
