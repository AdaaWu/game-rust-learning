story = """
塔的第三層要照潮汐表走：先橫著走、再上下爬，才不會被浪捲走。
海鷗拍胸脯說：「潮汐表我測過了，沒問題！」結果我爬到一半就卡在錯的格子上。
原來牠只測了往右。這層的守門員規定：自己寫的測試要真的抓得到錯，才准上樓。
"""

concept = """
## 測試是什麼

- `#[test]`：標記一個測試函式，`cargo test`（或 `rustc --test`）會執行它
- `#[cfg(test)] mod tests { use super::*; ... }`：測試模組只在測試模式編譯，正式程式不含它
- `assert_eq!(實際, 預期, "訊息")`：不相等就 panic，訊息會跟著印出來
- `assert!(條件, "訊息")`：條件為 false 就 panic
- 測試失敗 = 測試函式 panic；沒 panic 就算通過

## 好測試的定義

- 好測試是「**在錯的程式上會失敗**」的測試，而不是「在對的程式上會通過」
- 只測往右的測試，在「往左不會動」的程式上照樣通過，所以它抓不到這關的 bug
- 寫測試時先問：這個函式可能錯在哪？每一種錯，我有沒有一個案例會失敗？

## 邊界案例（edge case）

- 方向：右、左、下、上各至少一次（負數是最常漏的）
- 只動一軸：只有水平、只有垂直
- 兩軸都動：順序要對（先水平再垂直）
- 0 距離：原地不動，不該有任何指令

## 這關怎麼判題：突變測試（mutation testing）

- 突變測試：故意把正確程式改壞一點（突變體），看測試能不能抓到
- 判題器把**正確版本**和**好幾個壞掉的版本**輪流傳給你的 `check_steps`
  - 正確版本：`check_steps` 不可以 panic
  - 每個壞掉的版本：`check_steps` 都必須 panic
- 參數型別 `fn((i32, i32), (i32, i32)) -> Vec<String>` 是**函式指標**（function pointer）：把函式當值傳進去，所以同一個檢查能套在不同實作上
- Submit 只跑隱藏測試，不跑你寫在 `mod tests` 裡的 `#[test]`；它們仍會一起編譯

## 盲點：拿自己的實作當標準答案

- 寫成 `assert_eq!(steps(a, b), steps_to(a, b))`（差分測試，differential testing）看起來省事
- 但 `steps_to` 有 bug 時，標準答案跟著錯，測試永遠通過
- 預期值要**手寫**，從需求推出來，不從受測程式算出來
"""

hints = [
  "海鷗只測了「往右兩格」。steps_to 可能錯在哪些方向？每個方向你都有一個會失敗的案例嗎？",
  "先在 check_steps 加一個往左的案例，Run 一次：main 會先跑你的檢查，panic 訊息會告訴你 steps_to 錯在哪",
  "steps_to 的 bug：dx 是負數時 0..dx 是空範圍，迴圈一次都不跑；次數應該用絕對值",
  "check_steps 至少要涵蓋：往右、往左、只往下、只往上、兩軸都動（檢查先水平後垂直）、原地不動回傳空的；預期值一律手寫",
]

