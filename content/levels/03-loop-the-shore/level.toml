story = """
穿過岩縫，眼前是一片三層的階梯海岸，每一層盡頭都卡著一顆寶石。
要來回巡邏三趟，一趟就是六個 MOVE，手寫下去指令會長到看不完。
海鷗說：「同樣的事做很多次？那就交給迴圈啊。」
"""

concept = """
## 三種迴圈

- `for i in 0..n { ... }`：跑固定次數，`0..n` 是 range，包含 0、不含 n
- `while 條件 { ... }`：條件成立就繼續跑，適合「不知道要跑幾次」
- `loop { ... }`：無限迴圈，靠 `break` 離開

## loop 可以帶回一個值

- `break 值;` 會結束 `loop`，並把值當成整個 `loop` 運算式的結果
- 放在函式最後一行（不加分號），就直接成為回傳值

```rust
let mut n = 0;
let found = loop {
    n += 1;
    if n * n > 20 {
        break n;
    }
};
```

## 取捨

- 能用 `for` 就用 `for`：次數由 range 決定，不會忘記遞增而跑成無窮迴圈
- `while`、`loop` 比較自由，但要自己保證條件一定會結束
- `cmds.extend(另一個 Vec)`：把另一個清單的內容全部接到尾端
"""

