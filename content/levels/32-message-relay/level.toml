  "scout 只要一行 tx.send(...).unwrap()；collect 用 while let Ok(r) = rx.recv_timeout(PATIENCE) 收進 Vec，再 sort_by_key 與 flat_map",
  "relay：mpsc::channel() → 迴圈裡 let tx = tx.clone(); thread::spawn(move || scout(crab, tx)) → drop(tx) → collect(rx)",
]

