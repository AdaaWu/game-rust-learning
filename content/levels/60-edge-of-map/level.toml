concept = """
## usize 的邊界：0 再減 1

- `len()` 回傳 `usize`，是**無號整數**，最小就是 0
- `gems.len() - 1` 在空清單上等於 `0 - 1`：debug 編譯（Run 與測試都是）直接 **panic**：`attempt to subtract with overflow`
- panic 訊息會帶行號，直接指到那一行減法

## 「最後一個」本來就可能不存在

- 空清單沒有最後一個元素，回傳型別 `Option` 已經說明了這件事
- 標準庫的 `slice.last()` 回傳 `Option<&T>`：空的時候是 `None`
- `.copied()` 把 `Option<&T>` 換成 `Option<T>`（`T` 是 `Copy` 時）
- 先檢查 `is_empty()` 再減也可以，取捨是多一個分支、日後容易忘記同步

## off-by-one：多一格與少一格

- `0..n` 有 n 個數、`0..=n` 有 n + 1 個數
- 從一排最左格走到最右格，寬 `w` 格只要走 `w - 1` 步；寫成 `0..=w` 會多走兩步、衝出地圖
- 寫範圍時問自己：「起點算不算？終點算不算？」

## Debug 心法

- D1 等級的 bug：先讀 panic 訊息，再看它指的那一行
- 問自己：這一行在**什麼輸入**下會出事？用最小的輸入（空、一個）去想
"""

hints = [
  "panic 訊息說減法溢位，它指著哪一行？那一行在什麼情況下會算出負數？",
  "第二座島一顆寶石都沒有：清單長度是 0 的時候，len() - 1 等於多少？",
  "slice 本來就有一個「拿最後一個，沒有就給 None」的方法，回傳型別跟 last_gem 只差一個 copied",
]

