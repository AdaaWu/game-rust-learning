concept = """
## Result 不能默默丟掉

- `Result` 標了 `#[must_use]`：呼叫後不處理，編譯器會警告 `unused_must_use`
- `let _ = expr;` 是「我明確不要這個值」：結果被丟掉，**連警告也一起關掉**
- 錯誤被吞掉之後，程式在錯的前提下繼續跑：這關的 `unlock` 回報 `Ok(())`，門其實沒開

## 正確處理錯誤的幾種方式

- 往上傳：`expr?`，交給呼叫者決定
- 換備案：`a.or_else(|_| b)`：`a` 失敗才試 `b`，兩個都失敗才回傳錯誤
- 轉錯誤型別：`.map_err(|_| TowerError::Locked { floor })`：把底層的 `LockError` 換成上層看得懂的錯
- 自己處理：`match` 每一種結果，每條路徑都要有明確的下一步

## 什麼時候 let _ 是合理的

- 真的不在乎結果，而且失敗也不影響後續（例如寫 log 失敗）
- 寫的時候加一行註解說明為什麼可以忽略；這關的備用鑰匙不屬於這種情況

## Debug 心法

- 沒有 panic、沒有警告，只有「結果不對」時，去找**錯誤在哪裡消失**
- 從出事的畫面往回推：Ferris 停在第 2 層門前 → 門沒開 → 誰說門開了？
- 搜尋 `let _ =`、`.ok()`、`unwrap_or_default()` 這類會把錯誤變不見的寫法
"""

