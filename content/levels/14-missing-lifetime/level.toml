id = "14-missing-lifetime"
chapter = 4
order = 14
title = "古碑上的兩個名字"
kind = "fix-compile"
visual = "memory"

story = """
游過所有權之海，我爬上一座長滿青苔的遺跡，這裡就是生命週期遺跡。
入口的古碑刻著兩個名字，傳說較長的那個是遺跡的主人。
我寫好比較字數的函式，編譯器卻反問：「你回傳的名字，是從哪一個借來的？」
"""

concept = """
## 回傳參考時，編譯器要知道它從哪來

- 回傳 `&str` 代表「借用某個東西」，編譯器必須確認那個東西活得比回傳值久
- `clean(name: &str) -> &str` 只有一個參考輸入，**省略規則（lifetime elision）** 自動推斷：回傳值借自 `name`
- `longer(a: &str, b: &str) -> &str` 有兩個參考輸入，可能回傳 `a` 也可能回傳 `b`，編譯器猜不出來，回報 **E0106** missing lifetime specifier

## 生命週期標註 `'a`

- `fn longer<'a>(a: &'a str, b: &'a str) -> &'a str`
- 意思是：回傳值至少在 `a` 和 `b` **都還活著**的期間有效
- 標註不會延長任何值的壽命，只是把「誰借誰」寫進簽名，讓編譯器在**呼叫端**檢查

## 省略規則（三條）

- 每個參考參數各自得到一個生命週期
- 只有一個參考輸入時，回傳值沿用它
- 方法有 `&self` 時，回傳值沿用 `self`（第 16 關會用到）

## 取捨

- 回傳 `&str`：零複製，但呼叫端必須讓兩個名字活得夠久
- 回傳 `String`：呼叫端最自由，代價是多一次配置與複製
"""

hints = [
  "錯誤指向 longer 的回傳型別：只看簽名，編譯器分不出回傳值借自 a 還是 b",
  "為什麼 clean 不用標？它只有一個參考輸入，省略規則自動處理",
  "在 longer 後面宣告 <'a>，讓 a、b 與回傳值都用 &'a str",
]

