id = "41-error-ladder"
chapter = 10
order = 41
title = "錯誤的梯子"
kind = "build"
visual = "memory"

story = """
塔的第二層守門員遞給我一張爬塔計畫，上面寫著「2,三」。
我一看就懂，可是讀計畫的程式只會喊「錯了」，說不出錯在哪一層、為什麼錯。
守門員說：錯誤要像梯子，一格一格往上交代清楚，最上面的人才知道源頭在哪。
幫我把每一層的錯誤都接上梯子吧。
"""

concept = """
## 自訂錯誤型別

- 用 `enum` 列出這一層可能出的錯：`FloorError::BadNumber(ParseIntError)`、`FloorError::Missing`
- 錯誤要能印給人看：實作 `fmt::Display`
- 錯誤要能被當成「一般的錯誤」使用：實作 `std::error::Error`（需要先有 `Debug` 和 `Display`）

## source()：錯誤的源頭

- `Error::source()` 回傳「是誰造成我」：`BadNumber` 的源頭是裡面的 `ParseIntError`
- 外層一路呼叫 `source()`，就能把整條錯誤鏈印出來（main 裡的 `while let` 就是在做這件事）
- 慣例：`Display` 只講這一層發生什麼事，細節交給 `source()`，避免同一句話印兩次

## From 與 ?：錯誤自動往上轉

- `?` 遇到 `Err(e)` 時，會先呼叫 `From::from(e)` 轉成函式宣告的錯誤型別，再 `return`
- 兩層 `From`：`ParseIntError → FloorError`、`FloorError → ClimbError`，`?` 一路往上包
- 每包一層，舊錯誤就成為新錯誤的 `source()`

## Box<dyn Error>：應用層什麼錯都收

- `Box<dyn Error>`：把任何實作 `Error` 的值搬到 heap，只留一個胖指標（資料位址 + vtable）
- 標準庫已經提供 `impl From<E: Error> for Box<dyn Error>`，`climb(plan)?` 直接就能轉
- 連字串也能轉：`Err("計畫是空的".into())`
- `downcast_ref::<ClimbError>()`：從 `dyn Error` 取回原本的型別；型別不對回傳 `None`

## 取捨：具體型別 vs Box<dyn Error>

- 函式庫層用具體 enum：呼叫者可以 `match` 每一種錯，編譯器會檢查有沒有漏
- 應用層用 `Box<dyn Error>`：省去替每種組合寫 enum，代價是要 `downcast_ref` 才能分辨
- 全部轉成 `String` 最省事，但錯誤種類和源頭都消失了，上層再也無法判斷要不要重試或改走備案
"""

hints = [
  "先看記憶體圖：錯誤在哪一層產生？每經過一個 ?，外面多包了哪一層？",
  "Display 用 match self 每個變體 write! 一句話；source 用 match 回傳 Some(裡面的錯誤) 或 None",
  "From 只要回答一件事：收到下一層的錯誤，要包進自己的哪個變體？read_floor 會遇到三種輸入：空白、不是數字、正常數字；哪一種可以直接交給 ? 自動轉換？",
  "climb 要先把計畫切成一段一段：哪個 str 方法能照逗號切開？每段讀出樓層數後還要擋什麼？run 交給 climb 之前要先擋哪一種計畫，climb 的錯誤又要怎麼變成 Box<dyn Error>？",
]

