迷宮最深處，心跳聲咚、咚地響著，那裡就是迷宮之心。
海鷗先飛一趟探路，再和我接力穿過迷宮，最後由我爬上去撿齊四顆寶石。
可是我一出發就撞牆，修好一處，又在別的地方卡住。
老龍蝦說：這裡用到你在迷宮學過的每一個 trait，一次修一個，每修一個就再 Run 一次。
