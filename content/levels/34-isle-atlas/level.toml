story = """
大遷徙結束了，螃蟹們在新大陸開了工坊和市集，我負責管帳、管地圖、管貨。
第一份工作是畫地名冊：每座島叫什麼、在哪裡，查一下就要知道。
海鷗替我報路，可是牠同一座島喊了三次，還喊了根本不存在的「龍蝦島」。
同一座島我只想去一次，沒聽過的地方就別理牠。
"""

concept = """
## HashMap：用名字查東西

- `HashMap<K, V>`：一組「鍵 → 值」，用鍵查值平均 **O(1)**（雜湊函式直接算出放在哪一格）
- `insert(k, v)`：放入；同一個鍵再放一次會**覆蓋**舊值，並回傳 `Some(舊值)`
- `get(&k)` 回傳 `Option<&V>`：查不到是 `None`，不會 panic
  - 對照 `atlas["龍蝦島"]`：用中括號查不到會直接 panic
- 鍵是 `String` 時，可以直接拿 `&str` 去查：`atlas.get("珊瑚島")`

## HashSet：只在乎「有沒有」

- `HashSet<T>`：只有鍵、沒有值的 HashMap，同一個值只會存一份
- `insert(v)` 回傳 `bool`：`true` 代表之前沒有、這次新放進去
  - 一行同時做到「判斷有沒有去過」與「記下來」
- `contains(&v)`：只查不放

## HashMap 不保證順序

- 走訪 HashMap（`for (k, v) in &atlas`）的順序和放入順序無關，**每次執行都可能不同**
  - Rust 預設的雜湊用隨機種子，防止別人故意塞一堆會撞在同一格的鍵（HashDoS 攻擊）
- 需要順序時，順序要放在別的地方：本關由 `first_visits` 回傳的 `Vec` 保留海鷗喊的順序

## 取捨：用 Vec 找也找得到

- `entries.iter().find(|(n, _)| n == name)`：結果一樣，但每次都從頭比到尾，**O(n)**
- 地名冊只有 4 座島時差不多；有一萬座島、要查一萬次時，差距就是一萬倍
"""

hints = [
  "first_visits 要怎麼知道一座島「去過沒有」？HashSet 的 insert 回傳值能幫你什麼？",
  "seen 是測試傳進來的，裡面可能已經有地名；走完之後，這次的新地名也要留在 seen 裡",
  "locate 用 if let Some(spot) = atlas.get(stop) 查，查到才 push；龍蝦島查不到就自然略過",
]

